<title>OilTech Radar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#f1f4f8; --surface:#ffffff; --surface-2:#f7f9fb; --line:#dfe5ec; --line-2:#eef2f6;
  --ink:#131c28; --ink-2:#3d4a59; --muted:#6b7887; --faint:#9aa6b3;
  --accent:#0b5c7a; --accent-ink:#ffffff; --accent-soft:#e3f0f5; --accent-line:#b9d6e1;
  --amber:#b45309; --amber-soft:#fdf1e2;
  --news:#2a78d6; --sci:#1baf7a; --inv:#eb6834; --pat:#4a3aa7; --pol:#c98500; --pol-soft:#fdf3dc;
  --st-break:#2a78d6; --st-emerg:#1baf7a; --st-mature:#4a3aa7; --st-fade:#8a949e;
  --good:#008300; --bad:#e34948; --good-soft:#e6f4e6; --bad-soft:#fdeaea;
  --seq1:#cde2fb; --seq2:#9ec5f4; --seq3:#6da7ec; --seq4:#3987e5; --seq5:#256abf; --seq6:#184f95;
  --shadow:0 1px 2px rgba(19,28,40,.06),0 8px 24px -12px rgba(19,28,40,.12);
  --r:12px; --r-s:8px;
  --font-d:"Manrope",system-ui,sans-serif; --font-b:"IBM Plex Sans",system-ui,sans-serif; --font-m:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e141b; --surface:#151d26; --surface-2:#1b2530; --line:#28343f; --line-2:#202a34;
    --ink:#eaf0f6; --ink-2:#c3ccd6; --muted:#93a1b0; --faint:#66727f;
    --accent:#4aa9c9; --accent-ink:#0b1720; --accent-soft:#12303c; --accent-line:#245667;
    --amber:#f2a35c; --amber-soft:#3a2a15;
    --news:#3987e5; --sci:#199e70; --inv:#d95926; --pat:#9085e9; --pol:#eda100; --pol-soft:#3a2d10;
    --st-break:#3987e5; --st-emerg:#199e70; --st-mature:#9085e9; --st-fade:#6c7883;
    --good:#4fbf4f; --bad:#e66767; --good-soft:#163a16; --bad-soft:#3d1c1c;
    --seq1:#183353; --seq2:#1c4a7a; --seq3:#2361a3; --seq4:#3987e5; --seq5:#6da7ec; --seq6:#9ec5f4;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e141b; --surface:#151d26; --surface-2:#1b2530; --line:#28343f; --line-2:#202a34;
  --ink:#eaf0f6; --ink-2:#c3ccd6; --muted:#93a1b0; --faint:#66727f;
  --accent:#4aa9c9; --accent-ink:#0b1720; --accent-soft:#12303c; --accent-line:#245667;
  --amber:#f2a35c; --amber-soft:#3a2a15;
  --news:#3987e5; --sci:#199e70; --inv:#d95926; --pat:#9085e9; --pol:#eda100; --pol-soft:#3a2d10;
  --st-break:#3987e5; --st-emerg:#199e70; --st-mature:#9085e9; --st-fade:#6c7883;
  --good:#4fbf4f; --bad:#e66767; --good-soft:#163a16; --bad-soft:#3d1c1c;
  --seq1:#183353; --seq2:#1c4a7a; --seq3:#2361a3; --seq4:#3987e5; --seq5:#6da7ec; --seq6:#9ec5f4;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font-b);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-d);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px;font-weight:800}
h2{font-size:17px;font-weight:700}
h3{font-size:14px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-m);font-variant-numeric:tabular-nums}
.label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12px}

/* ---------- shell ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1440px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand-mark svg{width:20px;height:20px}
.brand-name{font-family:var(--font-d);font-weight:800;font-size:17px;letter-spacing:-.02em;line-height:1.1}
.brand-sub{font-size:12px;color:var(--muted);line-height:1.2}
.topbar-sp{flex:1}
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:13px;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent-line);background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn svg{width:15px;height:15px}
.btn.icon{padding:7px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}

.hero{background:var(--surface);border-bottom:1px solid var(--line)}
.hero-in{max-width:1440px;margin:0 auto;padding:22px 24px 18px;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:24px;align-items:end}
.hero h1{font-size:28px;line-height:1.15;max-width:30ch}
.hero .lede{margin-top:8px;color:var(--ink-2);max-width:62ch;font-size:14.5px}
.hero .lede b{font-weight:600;color:var(--ink)}
.hero-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fact{padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface-2)}
.fact .label{font-size:10.5px}
.fact .v{font-family:var(--font-d);font-weight:800;font-size:20px;letter-spacing:-.02em;margin-top:2px}
.fact .d{font-size:11.5px;color:var(--muted)}

.nav{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top,0px) + 55px);z-index:30}
.nav-in{max-width:1440px;margin:0 auto;padding:0 24px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav-in::-webkit-scrollbar{display:none}
.nav button{padding:12px 14px;font-weight:600;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.nav .cnt{font-family:var(--font-m);font-size:11px;font-weight:500;padding:1px 6px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.nav .dot{width:7px;height:7px;border-radius:50%;flex:none}

main{max-width:1440px;margin:0 auto;padding-block:20px 48px;padding-inline:24px}
.view[hidden]{display:none}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.card.flat{background:transparent;border:0;padding:0}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.card-h .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.card-h .tools{display:flex;gap:6px;align-items:center;flex:none}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}.c3{grid-column:span 3}
@media (max-width:1100px){.c8,.c7,.c6,.c5{grid-column:span 12}.c4,.c3{grid-column:span 6}}
@media (max-width:640px){.c4,.c3{grid-column:span 12}.hero-in{grid-template-columns:1fr}.hero-facts{grid-template-columns:1fr 1fr}.topbar-in,main,.nav-in,.hero-in{padding-inline:16px}}

.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:500;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag .dot{width:7px;height:7px;border-radius:50%}
.tag.demo{border-style:dashed;color:var(--muted)}
.tag.live{border-color:var(--good);color:var(--good);background:var(--good-soft)}
.tag.up{color:var(--good);background:var(--good-soft);border-color:transparent}
.tag.down{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.tag.news{background:color-mix(in srgb,var(--news) 12%,transparent);border-color:transparent;color:var(--news)}
.tag.sci{background:color-mix(in srgb,var(--sci) 14%,transparent);border-color:transparent;color:var(--sci)}
.tag.inv{background:color-mix(in srgb,var(--inv) 14%,transparent);border-color:transparent;color:var(--inv)}
.tag.pat{background:color-mix(in srgb,var(--pat) 14%,transparent);border-color:transparent;color:var(--pat)}

.help{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);color:var(--muted);font-size:11px;font-weight:700;font-family:var(--font-m);position:relative;vertical-align:middle;cursor:help;background:var(--surface)}
.help:hover,.help:focus-visible{border-color:var(--accent);color:var(--accent)}
.help .tip{display:none;position:absolute;z-index:50;top:24px;right:-8px;width:min(340px,80vw);background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:10px;font:12.5px/1.5 var(--font-b);text-align:left;font-weight:400;box-shadow:var(--shadow);cursor:default}
.help .tip b{color:inherit;display:block;margin-bottom:4px;font-family:var(--font-d)}
.help .tip ul{margin:6px 0 0;padding-left:16px}
.help .tip li{margin:2px 0}
.help:hover .tip,.help:focus-within .tip{display:block}
.help.left .tip{right:auto;left:-8px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.kpi .v{font-family:var(--font-d);font-weight:800;font-size:28px;letter-spacing:-.03em;line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:4px}
.kpi .d{margin-top:6px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kpi svg.spark{width:100%;height:28px;margin-top:8px;display:block}

/* map */
.map-wrap{position:relative;background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.map-wrap svg{display:block;width:100%;height:auto;touch-action:none;cursor:grab}
.map-wrap svg.dragging{cursor:grabbing}
.map-land{fill:color-mix(in srgb,var(--accent) 9%,var(--surface));stroke:color-mix(in srgb,var(--accent) 35%,var(--line));stroke-width:.7;vector-effect:non-scaling-stroke}
.zone{fill:var(--accent);fill-opacity:.16;stroke:var(--accent);stroke-opacity:.55;stroke-width:1;vector-effect:non-scaling-stroke;transition:fill-opacity .15s}
.zone.sci{fill:var(--sci);stroke:var(--sci)}
.zone.inv{fill:var(--inv);stroke:var(--inv)}
.zone:hover,.zone.active{fill-opacity:.38}
.zone-core{fill:var(--accent);stroke:var(--surface);stroke-width:1.5;vector-effect:non-scaling-stroke;pointer-events:none}
.zone-core.sci{fill:var(--sci)}.zone-core.inv{fill:var(--inv)}
.map-label{font:600 11px var(--font-b);fill:var(--ink-2);pointer-events:none;paint-order:stroke;stroke:var(--surface-2);stroke-width:3px;stroke-linejoin:round}
.map-ctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.map-ctl button{width:30px;height:30px;border-radius:7px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:15px;color:var(--ink-2);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.map-ctl button:hover{border-color:var(--accent-line)}
.map-legend{position:absolute;left:12px;bottom:10px;display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);background:color-mix(in srgb,var(--surface) 85%,transparent);padding:6px 9px;border-radius:7px;backdrop-filter:blur(4px)}
.map-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.map-tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:9px 11px;border-radius:8px;font-size:12px;line-height:1.45;max-width:260px;display:none;z-index:5;box-shadow:var(--shadow)}
.map-tip b{display:block;font-family:var(--font-d);font-size:13px;margin-bottom:2px}
.map-side{display:flex;flex-direction:column;gap:10px}
.geo-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.geo-row:last-child{border-bottom:0}
.geo-row .bar{height:6px;border-radius:3px;background:var(--seq2);margin-top:5px;position:relative;overflow:hidden}
.geo-row .bar i{position:absolute;inset:0;background:var(--accent);border-radius:3px}
.geo-row .n{font-family:var(--font-m);font-size:12.5px;color:var(--ink-2)}

/* signals */
.sig-list{display:flex;flex-direction:column}
.sig{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
.sig:last-child{border-bottom:0}
.sig:hover .t{color:var(--accent)}
.sig .ico{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line-2);font-family:var(--font-m);font-size:12px;font-weight:500;color:var(--ink-2)}
.sig .ico.hot{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.sig .t{font-weight:600;font-size:13.5px;line-height:1.3}
.sig .m{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sig .m .tag{padding:0 6px;font-size:10.5px}
.sig svg{width:64px;height:26px}

/* landscape matrix */
.matrix{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
.matrix th{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.matrix th.c,.matrix td.c{text-align:center}
.matrix td{padding:5px 8px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.matrix tr:last-child td{border-bottom:0}
.matrix td.name{font-weight:600;white-space:nowrap}
.matrix td.name small{display:block;font-weight:400;color:var(--muted);font-size:11px;white-space:normal}
.cell{display:inline-block;min-width:44px;padding:4px 6px;border-radius:6px;font-family:var(--font-m);font-size:12px;text-align:center;color:var(--ink)}
.cell.l0{background:transparent;color:var(--faint)}
.cell.l1{background:var(--seq1)}.cell.l2{background:var(--seq2)}.cell.l3{background:var(--seq3);color:#fff}.cell.l4{background:var(--seq4);color:#fff}.cell.l5{background:var(--seq5);color:#fff}
.matrix tr.clickable{cursor:pointer}
.matrix tr.clickable:hover td{background:var(--surface-2)}
.matrix .trend{width:70px;height:22px;display:block}
.matrix .live-mark{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-left:6px;vertical-align:1px}

/* sources */
.src-row{display:grid;grid-template-columns:1fr 92px 64px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.src-row:last-child{border-bottom:0}
.src-row .n{font-weight:600}
.src-row .k{font-size:11.5px;color:var(--muted)}
.score{display:flex;align-items:center;gap:8px}
.score .bar{flex:1;height:6px;border-radius:3px;background:var(--line-2);overflow:hidden}
.score .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.score .v{font-family:var(--font-m);font-size:12.5px;width:28px;text-align:right}

/* sub nav chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--accent-line)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .cnt{font-family:var(--font-m);font-size:11px;opacity:.7}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--good)}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters .sp{flex:1}
select,input[type=text],input[type=search],input[type=url]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:13px}
input[type=search]{min-width:220px}
.search{position:relative}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted)}
.search input{padding-left:30px}

/* quadrant */
.quad{position:relative}
.quad svg{width:100%;height:auto;display:block}
.quad .axis{font:11px var(--font-b);fill:var(--muted)}
.quad .qlabel{font:600 11px var(--font-b);fill:var(--faint);letter-spacing:.04em;text-transform:uppercase}
.quad .gl{stroke:var(--line-2);stroke-width:1}
.quad .mid{stroke:var(--line);stroke-width:1;stroke-dasharray:none}
.quad circle{stroke:var(--surface);stroke-width:2;cursor:pointer;transition:r .15s}
.quad circle:hover{stroke:var(--ink)}
.quad circle.dim{opacity:.18}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:9px 11px;border-radius:8px;font-size:12px;line-height:1.45;max-width:280px;display:none;z-index:5;box-shadow:var(--shadow)}
.tip b{display:block;font-family:var(--font-d);font-size:13px;margin-bottom:3px}

/* lines chart */
.lines svg{width:100%;height:auto;display:block}
.lines .gl{stroke:var(--line-2)}
.lines .axis{font:11px var(--font-b);fill:var(--muted)}
.lines path.s{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.lines path.s.dim{opacity:.15}
.lines .end{font:600 11px var(--font-b);fill:var(--ink-2)}
.pick{display:flex;flex-direction:column;gap:2px;max-height:300px;overflow:auto;padding-right:4px}
.pick button{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;text-align:left;padding:6px 8px;border-radius:7px;font-size:12.5px}
.pick button:hover{background:var(--surface-2)}
.pick button i{width:10px;height:10px;border-radius:3px;border:1.5px solid var(--line);flex:none}
.pick button[aria-pressed="true"] i{border-color:transparent}
.pick button[aria-pressed="true"]{background:var(--surface-2);font-weight:600}
.pick .n{font-family:var(--font-m);font-size:11.5px;color:var(--muted)}

/* two lists growing/fading */
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.two{grid-template-columns:1fr}}
.mini{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:13px;cursor:pointer}
.mini:last-child{border-bottom:0}
.mini:hover .t{color:var(--accent)}
.mini .n{font-family:var(--font-m);font-size:12px;white-space:nowrap}

/* company chips */
